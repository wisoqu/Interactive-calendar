name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-and-tests:
    name: TypeScript, unit/integration tests, installer simulation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Shell script syntax
        run: bash -n install.sh && bash -n backup.sh && bash -n docker-entrypoint.sh && bash -n tests/install-sim.sh

      - name: Strict TypeScript check
        run: npm run lint

      - name: Verification suite (security, RBAC, SQLite, rate limits, proxy)
        run: npm test

      - name: Offline installer simulation (mocked Docker/Nginx/Certbot)
        run: npm run test:install

      - name: Production build
        run: npm run build

  docker-image:
    name: Docker image build and health smoke test
    runs-on: ubuntu-latest
    needs: typescript-and-tests
    steps:
      - uses: actions/checkout@v5

      - name: Validate docker-compose.yml
        run: |
          # .env is gitignored but required by env_file; install.sh generates it in production
          cp .env.example .env
          docker compose config -q

      - name: Build production image
        run: docker build -t interactive-calendar:ci .

      - name: Run container and verify /api/health and the SPA
        run: |
          mkdir -p ci-data
          docker run -d --name ic-ci \
            -p 127.0.0.1:3000:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e SQLITE_DB_PATH=/app/data/calendar_db.sqlite \
            -v "$PWD/ci-data:/app/data" \
            interactive-calendar:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health/db >/dev/null; then
              echo "Health OK after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health/db
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root">'
          # Verify the SQLite file is persisted on the host volume
          test -f ci-data/calendar_db.sqlite
          docker logs ic-ci
          docker rm -f ic-ci
